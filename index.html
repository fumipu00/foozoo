    <style>
        :root {
            --ikea-blue: #0051ba;
            --ikea-yellow: #ffda1a;
            --status-visited: #0051ba;
            --status-wantto: #e6f2ff;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --gender-male: #0066cc;
            --gender-female: #e60073;
            --color-hokkaido: #4a7c59;
            --color-tohoku: #68b0ab;
            --color-kanto: #d68060;
            --color-hokuriku: #a37081;
            --color-chubu: #e0a96d;
            --color-kinki: #6c5b7b;
            --color-chugoku: #8f94fb;
            --color-shikoku: #ff8b94;
            --color-kyushu: #7da87b;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: none; }
        header { background-color: var(--ikea-blue); color: white; padding: 20px; text-align: center; }
        header h1 { margin: 0; font-size: 28px; font-weight: 900; }
        header h1 span { color: var(--ikea-yellow); }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .progress-container { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
        .progress-bar-bg { background: #eee; border-radius: 10px; height: 20px; overflow: hidden; }
        .progress-bar { background: var(--ikea-blue); height: 100%; width: 0%; transition: width 0.4s ease; }
        .filter-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
        .filter-btn { background: #e0e0e0; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .filter-btn.active { background: var(--ikea-blue); color: white; }
        .spot-list { display: flex; flex-direction: column; gap: 12px; }
        
        /* ホーム画面カード */
        .spot-card { background: var(--card-bg); padding: 15px 20px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; position: relative; }
        .spot-card.visited { background-color: var(--status-visited); }
        .spot-card.wantto { background-color: var(--status-wantto); }
        .spot-left { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
        .spot-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .spot-name { font-weight: bold; font-size: 16px; }
        
        /* 🗺️ MAPボタンのスタイル */
        .map-link { background-color: #e6f2ff; color: var(--ikea-blue); font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; border: 1px solid #b3d7ff; height: 16px; box-sizing: border-box; }
        .map-link:active { background-color: #b3d7ff; }

        .status-badge { font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .status-badge.visited { background-color: #ffffff; color: #0051ba; }
        .status-badge.wantto { background-color: #ffffff; color: var(--ikea-blue); border: 1px solid var(--ikea-blue); }
        .visit-date-text { font-size: 11px; color: #b38600; font-weight: bold; }
        .oshi-list-home { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
        .oshi-info { font-size: 13px; font-weight: bold; }
        .oshi-info.male { color: var(--gender-male); }
        .oshi-info.female { color: var(--gender-female); }
        .oshi-info.none { color: #555555; }
        
        /* 📸 ホーム画面用の複数画像サムネイル */
        .home-image-gallery { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .home-spot-thumbnail { width: 60px; height: 60px; object-fit: contain; border-radius: 4px; background: #eee; border: 1px solid #ddd; cursor:pointer; }

        /* タグ表示エリアのレイアウト調整 */
        .spot-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
        .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; }
        .tag.reg-hokkaido { background-color: var(--color-hokkaido); }
        .tag.reg-tohoku { background-color: var(--color-tohoku); }
        .tag.reg-kanto { background-color: var(--color-kanto); }
        .tag.reg-hokuriku { background-color: var(--color-hokuriku); }
        .tag.reg-chubu { background-color: var(--color-chubu); }
        .tag.reg-kinki { background-color: var(--color-kinki); }
        .tag.reg-chugoku { background-color: var(--color-chugoku); }
        .tag.reg-shikoku { background-color: var(--color-shikoku); }
        .tag.reg-kyushu { background-color: var(--color-kyushu); }
        .location-text { font-size: 12px; color: #555555; font-weight: bold; }
        .chevron { color: #ccc; font-size: 18px; padding-left: 10px; }
        
        /* モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #999; }
        .modal-title { margin-top: 0; color: var(--ikea-blue); font-size: 22px; padding-right: 30px; word-break: break-all; }
        .form-group { margin-top: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .status-selector { display: flex; gap: 8px; margin-top: 5px; }
        .status-btn { flex: 1; padding: 10px 4px; border: 2px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .status-btn.selected { border-color: var(--ikea-blue); background-color: #f0f6ff; color: var(--ikea-blue); }
        .oshi-wrapper { margin-top: 15px; }
        .oshi-item-form { background: #fff9e6; padding: 12px; border-radius: 8px; border: 1px solid var(--ikea-yellow); margin-bottom: 10px; position: relative; box-sizing: border-box; }
        .oshi-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .oshi-row .sub-group { flex: 1; min-width: 0; }
        .oshi-row label { font-size: 11px; color: #666; margin-bottom: 2px; }
        .gender-group { display: flex; gap: 12px; margin-top: 6px; font-size: 13px; flex-wrap: wrap; align-items: center; }
        .gender-group label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .remove-oshi-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #cc0000; cursor: pointer; font-size: 12px; font-weight: bold; }
        .add-oshi-btn { background: #ffffff; color: #b38600; border: 1px dashed var(--ikea-yellow); width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; box-sizing: border-box; }
        
        .form-group input[type="text"], .form-group input[type="date"], .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; -webkit-appearance: none; min-height: 38px; }
        
        /* 📸 詳細画面：中サイズサムネイルのギャラリー */
        .modal-image-gallery { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .modal-image-container { position: relative; width: 90px; height: 90px; border-radius: 8px; overflow: hidden; background: #eee; border: 1px solid #ccc; cursor: pointer; }
        .modal-image-container img { width: 100%; height: 100%; object-fit: contain; }
        .modal-image-container .delete-img-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .file-input-label { background: #ffffff; color: var(--ikea-blue); border: 1px solid var(--ikea-blue); padding: 8px; border-radius: 6px; text-align: center; cursor: pointer; font-weight: bold; font-size: 14px; display: block; }
        .file-input-label:active { background: #f0f6ff; }
        input[type="file"] { display: none; }

        /* 🔍 写真拡大モーダル */
        .lightbox-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; padding: 10px; box-sizing: border-box; }
        .lightbox-content { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; font-weight: bold; }

        .save-btn { background-color: var(--ikea-blue); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; box-sizing: border-box; }
        #debug-error { color: red; background: #fff0f0; border: 1px solid red; padding: 15px; margin: 20px; border-radius: 8px; font-size: 14px; display: none; white-space: pre-wrap; }
        
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; font-weight:bold; color:var(--ikea-blue); }
        .spinner { width: 50px; height: 50px; border: 5px solid #eee; border-top: 5px solid var(--ikea-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
.floating-friend-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.floating-friend{position:absolute;width:80px;height:80px;object-fit:contain;opacity:.8;animation:floatFriend 18s ease-in-out infinite;}
@keyframes floatFriend{
0%{transform:translate(0,0) rotate(0deg);}
25%{transform:translate(30px,-40px) rotate(5deg);}
50%{transform:translate(-20px,-80px) rotate(-5deg);}
75%{transform:translate(40px,-20px) rotate(3deg);}
100%{transform:translate(0,0) rotate(0deg);}
}

        }
    })();

function renderFloatingFriends(){
 const layer=document.getElementById('floatingFriendLayer');
 if(!layer) return;
 layer.innerHTML='';
 const imgs=[...(friendsImages||[])].sort(()=>Math.random()-0.5).slice(0,3);
 imgs.forEach((src,i)=>{
   const img=document.createElement('img');
   img.src=src;
   img.className='floating-friend';
   img.style.left=(10+i*30+Math.random()*20)+'%';
   img.style.top=(15+Math.random()*60)+'%';
   img.style.animationDelay=(i*2)+'s';
   layer.appendChild(img);
 });
}

</script>

    const regions = ["全国", "北海道", "東北", "関東", "北陸", "中部", "近畿", "中国", "四国", "九州・沖縄"];
    
    function getRegionClass(region) {
        switch(region) {
            case "北海道": return "reg-hokkaido";
            case "東北": return "reg-tohoku";
            case "関東": return "reg-kanto";
            case "北陸": return "reg-hokuriku";
            case "中部": return "reg-chubu";
            case "近畿": return "reg-kinki";
            case "中国": return "reg-chugoku";
            case "四国": return "reg-shikoku";
            case "九州・沖縄": return "reg-kyushu";
            default: return "region";
        }
    }

    let currentRegion = "全国";
    let currentSelectedSpotId = null;
    let selectedStatus = "none";
    let oshiCounter = 0;
    let userRecords = {};
    let friendsImages = [];
    let tempImagesArray = []; 

    window.onload = function() {
        renderFilterButtons();
        loadDataFromGAS(); 
    };

    function showLoading(show, text = "Now loading...") {
        const overlay = document.getElementById('loading-overlay');
        document.getElementById('loading-text').innerText = text;
        overlay.style.display = show ? 'flex' : 'none';
    }

    function loadDataFromGAS() {
        showLoading(true, "Now loading...");
        fetch(GAS_URL)
            .then(res => res.json())
            .then(data => {
                if(data.records){userRecords=data.records||{};friendsImages=data.friendsImages||[];}else{userRecords=data||{};}
                renderSpotList();
                updateProgressBar();
                showLoading(false);
            })
            .catch(err => {
                console.error("データの取得に失敗しました", err);
                userRecords = JSON.parse(localStorage.getItem('foozoo_records_v4')) || {};
                renderSpotList();
                updateProgressBar();
                showLoading(false);
            });
    }

    function saveSingleRecordToGAS(spotId, singleRecord) {
        showLoading(true, "Now loading...");
        
        fetch(GAS_URL)
            .then(res => res.json())
            .then(latestServerData => {
                const combinedRecords = latestServerData || {};
                combinedRecords[spotId] = singleRecord;
                
                return fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(combinedRecords),
                    headers: { 'Content-Type': 'text/plain' } 
                });
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    userRecords[spotId] = singleRecord;
                    localStorage.setItem('foozoo_records_v4', JSON.stringify(userRecords));
                    renderSpotList();
                    updateProgressBar();
                } else {
                    alert("保存時にエラーが発生しました: " + res.message);
                }
                showLoading(false);
            })
            .catch(err => {
                console.error("データの同期保存に失敗しました", err);
                alert("通信エラーのため、サーバーと同期できませんでした。スマホ内に一時保存します。次回起動時に最新データが読み込まれます。");
                userRecords[spotId] = singleRecord;
                localStorage.setItem('foozoo_records_v4', JSON.stringify(userRecords));
                renderSpotList();
                updateProgressBar();
                showLoading(false);
            });
    }

    function renderFilterButtons() {
        const container = document.getElementById('filterContainer');
        container.innerHTML = regions.map(reg => `
            <button class="filter-btn ${reg === currentRegion ? 'active' : ''}" onclick="changeRegion('${reg}')">
                ${reg}
            </button>
        `).join('');
    }

    function changeRegion(region) {
        currentRegion = region;
        renderFilterButtons();
        renderSpotList();
    }

    function updateProgressBar() {
        const total = spotsData.length;
        let visitedCount = 0;
        spotsData.forEach(spot => {
            if (userRecords[spot.id]?.status === 'visited') visitedCount++;
        });
        const percent = total > 0 ? Math.round((visitedCount / total) * 100) : 0;
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressPercent').innerText = `${percent}% (${visitedCount} / ${total})`;
    }

    function formatDateString(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length === 3) return `${parts[0]}/${parts[1]}/${parts[2]}`;
        return dateStr;
    }

    function renderSpotList() {
        const listDiv = document.getElementById('spotList');
        if (!listDiv) return;
        listDiv.innerHTML = '';

        const filteredSpots = currentRegion === "全国" 
            ? spotsData 
            : spotsData.filter(s => s.region === currentRegion);

        filteredSpots.forEach(spot => {
            const record = userRecords[spot.id] || {};
            const status = record.status || "none";
            
            let cardClass = "spot-card";
            let statusHtml = "";
            if (status === "visited") {
                cardClass += " visited";
                const dateText = record.date ? ` <span class="visit-date-text">(${formatDateString(record.date)})</span>` : '';
                statusHtml = `<span class="status-badge visited">行った</span>${dateText}`;
            } else if (status === "wantto") {
                cardClass += " wantto";
                statusHtml = '<span class="status-badge wantto">行きたい</span>';
            }

            let oshisHtml = "";
            if (record.oshis && record.oshis.length > 0) {
                let itemsHtml = "";
                record.oshis.forEach(o => {
                    let genderMark = "";
                    let genderClass = "none";
                    if (o.gender === "male") { genderMark = " ♂"; genderClass = "male"; }
                    if (o.gender === "female") { genderMark = " ♀"; genderClass = "female"; }
                    const namePart = o.name ? `${o.name}` : '名前未設定';
                    const speciesPart = o.species ? `（${o.species}）` : '';
                    itemsHtml += `<div class="oshi-info ${genderClass}">❤ : ${namePart}${genderMark}${speciesPart}</div>`;
                });
                oshisHtml = `<div class="oshi-list-home">${itemsHtml}</div>`;
            }

            const mapUrl = `https://maps.google.com/?q=${encodeURIComponent(spot.name)}`;
            const mapButtonHtml = `<a href="${mapUrl}" target="_blank" class="map-link" onclick="event.stopPropagation();">MAP</a>`;

            let imgGalleryHtml = "";
            let imagesList = [];
            if (record.images && Array.isArray(record.images)) {
                imagesList = record.images;
            } else if (record.image) {
                imagesList = [record.image];
            }

            if (imagesList.length > 0) {
                const thumbnails = imagesList.map(imgSrc => `<img src="${imgSrc}" class="home-spot-thumbnail" alt="ミニ写真" onclick="event.stopPropagation(); openLightbox('${imgSrc}')">`).join('');
                imgGalleryHtml = `<div class="home-image-gallery">${thumbnails}</div>`;
            }

            const locationHtml = spot.location ? `<span class="location-text">${spot.location}</span>` : '';
            const regionClass = getRegionClass(spot.region);

            const card = document.createElement('div');
            card.className = cardClass;
            card.onclick = () => openModal(spot.id);
            card.innerHTML = `
                <div class="spot-left">
                    <div class="spot-name-row">
                        <span class="spot-name">${spot.name}</span>
                        ${statusHtml}
                    </div>
                    <div class="spot-tags">
                        <span class="tag ${regionClass}">${spot.region}</span>
                        ${locationHtml}
                        ${mapButtonHtml}
                    </div>
                    ${oshisHtml}
                    ${imgGalleryHtml}
                </div>
                <div class="chevron">＞</div>
            `;
            listDiv.appendChild(card);
        });
    }

    function setStatus(status) {
        selectedStatus = status;
        document.querySelectorAll('.status-btn').forEach(btn => {
            btn.classList.remove('selected');
            if (btn.getAttribute('data-status') === status) btn.classList.add('selected');
        });
    }

    function addOshiFormItem(species = "", name = "", gender = "none") {
        oshiCounter++;
        const container = document.getElementById('oshiFormContainer');
        if (!container) return;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'oshi-item-form';
        itemDiv.innerHTML = `
            <button type="button" class="remove-oshi-btn" onclick="this.parentElement.remove()">✖ 削除</button>
            <div class="oshi-row">
                <div class="sub-group">
                    <label>種類</label>
                    <input type="text" class="oshi-species-input" placeholder="例：ラッコ" value="${escapeHtml(species)}">
                </div>
                <div class="sub-group">
                    <label>お名前</label>
                    <input type="text" class="oshi-name-input" placeholder="例：メイちゃん" value="${escapeHtml(name)}">
                </div>
            </div>
            <div>
                <label>性別</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender_${oshiCounter}" value="none" ${gender === 'none' ? 'checked' : ''}> 指定なし</label>
                    <label><input type="radio" name="gender_${oshiCounter}" value="male" ${gender === 'male' ? 'checked' : ''}> ♂ 男の子</label>
                    <label><input type="radio" name="gender_${oshiCounter}" value="female" ${gender === 'female' ? 'checked' : ''}> ♀ 女の子</label>
                </div>
            </div>
        `;
        container.appendChild(itemDiv);
    }

    function handleImageSelected(input) {
        if (tempImagesArray.length >= 5) {
            alert("写真は最大5枚まで保存可能です。");
            input.value = "";
            return;
        }

        const file = input.files[0];
        if (!file) return;

        showLoading(true, "写真を圧縮・追加中...");

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const maxSide = 600;
                let width = img.width;
                let height = img.height;

                if (width > maxSide || height > maxSide) {
                    if (width > height) {
                        height = Math.round((height * maxSide) / width);
                        width = maxSide;
                    } else {
                        width = Math.round((width * maxSide) / height);
                        height = maxSide;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const base64Img = canvas.toDataURL('image/jpeg', 0.65);
                tempImagesArray.push(base64Img);
                
                renderModalImages();
                input.value = ""; 
                showLoading(false);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function renderModalImages() {
        const gallery = document.getElementById('modalImageGallery');
        if (!gallery) return;
        gallery.innerHTML = "";

        tempImagesArray.forEach((imgSrc, index) => {
            const container = document.createElement('div');
            container.className = "modal-image-container";
            container.onclick = () => openLightbox(imgSrc);
            container.innerHTML = `
                <img src="${imgSrc}" alt="プレビュー">
                <button type="button" class="delete-img-btn" onclick="event.stopPropagation(); removeModalImage(${index})">✕</button>
            `;
            gallery.appendChild(container);
        });
    }

    function removeModalImage(index) {
        tempImagesArray.splice(index, 1);
        renderModalImages();
    }

    function openLightbox(imgSrc) {
        document.getElementById('lightboxImage').src = imgSrc;
        document.getElementById('lightboxModal').style.display = 'flex';
    }
    function closeLightbox() {
        document.getElementById('lightboxModal').style.display = 'none';
    }

    function openModal(id) {
        currentSelectedSpotId = id;
        const spot = spotsData.find(s => s.id === id);
        const record = userRecords[id] || { status: "none", date: "", memo: "", oshis: [], images: [] };
        document.getElementById('modalSpotName').innerText = spot.name;
        
        const regionClass = getRegionClass(spot.region);
        const locationHtml = spot.location ? `<span class="location-text" style="display:inline-block; vertical-align:middle;">${spot.location}</span>` : '';
        document.getElementById('modalSpotTags').innerHTML = `
            <div style="margin-bottom:12px; display:flex; gap:8px; align-items:center;">
                <span class="tag ${regionClass}">${spot.region}</span>
                ${locationHtml}
            </div>
        `;
        setStatus(record.status || "none");
        
        document.getElementById('visitDate').value = record.date || "";
        document.getElementById('visitMemo').value = record.memo || "";
        
        if (record.images && Array.isArray(record.images)) {
            tempImagesArray = [...record.images];
        } else if (record.image) {
            tempImagesArray = [record.image];
        } else {
            tempImagesArray = [];
        }
        renderModalImages();

        const container = document.getElementById('oshiFormContainer');
        if (container) {
            container.innerHTML = "";
            if (record.oshis && record.oshis.length > 0) {
                record.oshis.forEach(o => addOshiFormItem(o.species, o.name, o.gender));
            } else {
                addOshiFormItem();
            }
        }
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
        currentSelectedSpotId = null;
    }

    function saveDetails() {
        const id = currentSelectedSpotId;
        if (!id) return;
        const oshiItems = document.querySelectorAll('.oshi-item-form');
        const oshisDataCollected = [];
        oshiItems.forEach(item => {
            const species = item.querySelector('.oshi-species-input').value.trim();
            const name = item.querySelector('.oshi-name-input').value.trim();
            const checkedRadio = item.querySelector('input[type="radio"]:checked');
            const gender = checkedRadio ? checkedRadio.value : "none";
            if (species || name) {
                oshisDataCollected.push({ species: species, name: name, gender: gender });
            }
        });
        const date = document.getElementById('visitDate').value;
        const memo = document.getElementById('visitMemo').value.trim();
        
        const singleRecord = { 
            status: selectedStatus, 
            date: date, 
            memo: memo, 
            oshis: oshisDataCollected,
            images: tempImagesArray 
        };
        
        if (selectedStatus === "none" && (date || memo || oshisDataCollected.length > 0 || tempImagesArray.length > 0)) {
            singleRecord.status = "wantto";
        }
        
        closeModal();
        saveSingleRecordToGAS(id, singleRecord);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

function toggleFriendsPage(){
 const p=document.getElementById('friendsPage');
 p.style.display=p.style.display==='none'?'block':'none';
 renderFriendsGallery(); renderFloatingFriends();
}
function renderFriendsGallery(){
 const g=document.getElementById('friendsGallery'); if(!g)return;
 g.innerHTML=(friendsImages||[]).map((img,i)=>`<div style="display:inline-block;position:relative;margin:5px"><img src="${img}" style="width:80px;height:80px;object-fit:cover"><button onclick="deleteFriendImage(${i})" style="position:absolute;right:0;top:0">×</button></div>`).join('');
}
function addFriendImage(inp){
 if(friendsImages.length>=10){alert('10枚までです');return;}
 const f=inp.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=e=>{friendsImages.push(e.target.result); renderFriendsGallery(); renderFloatingFriends(); renderFloatingFriends(); if(typeof saveSingleRecord==='function'){saveSingleRecord();}};
 r.readAsDataURL(f);
}
function deleteFriendImage(i){
 if(confirm('削除しますか？')){friendsImages.splice(i,1);renderFriendsGallery(); renderFloatingFriends();renderFloatingFriends();if(typeof saveSingleRecord==='function'){saveSingleRecord();}}
}
